# 🔴 NO es la font de veritat des del 24/09/2026: el fitxer executable viu al repo public
#    ~/dev/claude-shared-tree-guards/cases.yaml, en angles. Aquesta copia es nomes historica.
# cases.yaml — casos executables de shared-tree-guards.
# Cada AC-NN del SPEC cita un id d'aqui. El runner munta un repo git temporal per cas.

- id: AC-01
  guard: commit-guard
  repo: { staged: [a.md, b.md] }
  input: { command: 'git add a.md && git commit -m "x"' }
  expected: { exit: 2, mentions: [b.md] }

- id: AC-02
  guard: commit-guard
  repo: { staged: [a.md, b.md] }
  input: { command: 'git add a.md && git commit -m "text -- amb guions"' }
  expected: { exit: 2, mentions: [b.md] }

- id: AC-03
  guard: commit-guard
  repo: { staged: [a.md, b.md] }
  input: { command: 'git commit -m "text -- guions" -- a.md' }
  expected: { exit: 0 }

- id: AC-04
  guard: commit-guard
  repo: { staged: [a.md, b.md] }
  input: { command: 'git add a.md b.md && git commit -m "x"' }
  expected: { exit: 0 }

- id: AC-05
  guard: commit-guard
  repo: { staged: [] }
  input: { command: 'git commit -m "x"' }
  expected: { exit: 0 }

- id: AC-06
  guard: commit-guard
  repo: { staged_deletions_of_present_files: [z.md] }
  input: { command: 'git commit -m "x"' }
  expected: { exit: 2, mentions: [z.md] }

- id: AC-07
  guard: commit-guard
  repo: { staged_deletions_of_absent_files: [z.md] }
  input: { command: 'git add z.md && git commit -m "x"' }
  expected: { exit: 0 }

- id: AC-08
  guard: overwrite-guard
  repo: { modified_uncommitted: [a.md] }
  input: { command: 'git checkout origin/main -- a.md' }
  expected: { exit: 2, mentions: [a.md] }

- id: AC-09
  guard: overwrite-guard
  repo: { clean: [a.md] }
  input: { command: 'git checkout origin/main -- a.md' }
  expected: { exit: 0 }

- id: AC-10
  guard: cotenancy
  repo: { live_sessions: 2 }
  input: { mode: list }
  expected: { state: shared, others: 1 }

- id: AC-11
  guard: cotenancy
  repo: { dead_sessions: 1 }
  input: { mode: list }
  expected: { state: solo, others: 0 }

- id: AC-12
  guard: all
  repo: { git: false }
  input: { command: 'git commit -m "x"' }
  expected: { exit: 0, stdout: '', stderr: '' }

- id: AC-13
  guard: commit-guard
  repo: { staged: [a.md, b.md] }
  env: { SHARED_TREE_GUARDS_OFF: '1' }
  input: { command: 'git add a.md && git commit -m "x"' }
  expected: { exit: 0 }

- id: AC-14
  guard: commit-guard
  repo: { staged: [a.md, b.md], git_on_path: false }
  input: { command: 'git add a.md && git commit -m "x"' }
  expected: { exit: 0 }

- id: AC-15
  guard: commit-guard
  repo: { staged: [a.md, b.md] }
  input: { command: 'git add a.md && git commit -m "titol"' }
  expected: { exit: 2, stderr_contains: 'git commit -m "titol"' }

# Afegits 24/09/2026 en implementar T1-T4: el gate de co-tenancy era la peca que fa el
# plugin publicable i NO tenia cap cas que l'afirmes sobre una comanda real (nomes AC-10/11
# sobre el --list). Un invariant sense cas es prosa.

- id: AC-16
  guard: commit-guard
  repo: { staged: [a.md, b.md], live_sessions: 0 }
  input: { command: 'git add a.md && git commit -m "x"' }
  expected: { exit: 0, stderr: '' }

- id: AC-17
  guard: commit-guard
  repo: { staged_deletions_of_present_files: [z.md] }
  input: { command: 'git rm --cached z.md && git commit -m "x"' }
  expected: { exit: 0 }

- id: AC-18
  guard: cotenancy
  repo: { live_sessions: 2, self_in_linked_worktree: true }
  input: { mode: list, scope: tree }
  expected: { state: solo, others: 0 }

- id: AC-19
  guard: overwrite-guard
  repo: { modified_uncommitted: [a.md], live_sessions: 0 }
  input: { command: 'git checkout origin/main -- a.md' }
  expected: { exit: 0, stderr: '' }

# AC-20 tanca el forat que el propi control negatiu va assenyalar: AC-18 prova l'abast 'tree'
# pel CLI de cotenancy, pero cap cas el provava a traves d'un GUARD -- mutar 'tree'->'clone' al
# commit-guard no feia fallar res.
#
# Per aixo el meu index ha de portar una resta MEVA (d.md) que la comanda no stageja: amb abast
# 'tree' el guard ni s'executa (ningu comparteix el meu arbre) i passa; amb abast 'clone' es
# despertaria per la sessio del tronc i bloquejaria un commit que nomes em concerneix a mi. Sense
# el d.md, els dos abasts donen el mateix i el cas no prova res.
- id: AC-20
  guard: commit-guard
  repo:
    staged: [a.md, b.md]            # l'altra sessio, al tronc
    live_sessions: 2
    self_in_linked_worktree: true
    staged_in_worktree: [c.md, d.md]  # el MEU index, amb una resta meva que la comanda no stageja
  input: { command: 'git add c.md && git commit -m "x"' }
  expected: { exit: 0, stderr: '' }

# A subagent shares its session's index and no registry can see it: same session_id, same
# CLAUDE_PID. But a Bash call made by a subagent carries `agent_id` / `agent_type` and a
# main-session call does not (measured 2026-09-24), so co-tenancy is demonstrated by the payload
# itself. Both directions have to hold, hence two cases.

- id: AC-21
  guard: commit-guard
  repo: { staged: [a.md, b.md], live_sessions: 0 }
  input: { command: 'git add a.md && git commit -m "x"', agent_id: sub-1, agent_type: general-purpose }
  expected: { exit: 2, mentions: [b.md, SUBAGENT] }

- id: AC-22
  guard: commit-guard
  repo: { staged: [a.md, b.md], live_sessions: 1, recent_subagent: true }
  input: { command: 'git add a.md && git commit -m "x"' }
  expected: { exit: 2, mentions: [b.md, SUBAGENT] }

- id: AC-23
  guard: overwrite-guard
  repo: { modified_uncommitted: [a.md], live_sessions: 0 }
  input: { command: 'git checkout origin/main -- a.md', agent_id: sub-1 }
  expected: { exit: 2, mentions: [a.md, SUBAGENT] }
