# cases.yaml - the executable cases behind SPEC.md.
# Every AC-NN in the SPEC cites an id from here. The runner builds a temporary git repository
# per case and drives the REAL hook handlers as child processes. No mocks of git.
#
# Unless a case says otherwise, one other live Claude Code session is planted in the repo, because
# the guards are deliberately silent when you are alone. `live_sessions: 0` asserts that silence.

- id: AC-01
  guard: commit-guard
  repo: { staged: [a.md, b.md] }
  input: { command: 'git add a.md && git commit -m "x"' }
  expected: { exit: 2, mentions: [b.md] }

- id: AC-02
  guard: commit-guard
  repo: { staged: [a.md, b.md] }
  input: { command: 'git add a.md && git commit -m "text -- with dashes"' }
  expected: { exit: 2, mentions: [b.md] }

- id: AC-03
  guard: commit-guard
  repo: { staged: [a.md, b.md] }
  input: { command: 'git commit -m "text -- with dashes" -- a.md' }
  expected: { exit: 0 }

- id: AC-04
  guard: commit-guard
  repo: { staged: [a.md, b.md] }
  input: { command: 'git add a.md b.md && git commit -m "x"' }
  expected: { exit: 0 }

- id: AC-05
  guard: commit-guard
  repo: { staged: [] }
  input: { command: 'git commit -m "x"' }
  expected: { exit: 0 }

- id: AC-06
  guard: commit-guard
  repo: { staged_deletions_of_present_files: [z.md] }
  input: { command: 'git commit -m "x"' }
  expected: { exit: 2, mentions: [z.md] }

- id: AC-07
  guard: commit-guard
  repo: { staged_deletions_of_absent_files: [z.md] }
  input: { command: 'git add z.md && git commit -m "x"' }
  expected: { exit: 0 }

- id: AC-08
  guard: overwrite-guard
  repo: { modified_uncommitted: [a.md] }
  input: { command: 'git checkout origin/main -- a.md' }
  expected: { exit: 2, mentions: [a.md] }

- id: AC-09
  guard: overwrite-guard
  repo: { clean: [a.md] }
  input: { command: 'git checkout origin/main -- a.md' }
  expected: { exit: 0 }

- id: AC-10
  guard: cotenancy
  repo: { live_sessions: 2 }
  input: { mode: list }
  expected: { state: shared, others: 1 }

- id: AC-11
  guard: cotenancy
  repo: { dead_sessions: 1 }
  input: { mode: list }
  expected: { state: solo, others: 0 }

- id: AC-12
  guard: all
  repo: { git: false }
  input: { command: 'git commit -m "x"' }
  expected: { exit: 0, stdout: '', stderr: '' }

- id: AC-13
  guard: commit-guard
  repo: { staged: [a.md, b.md] }
  env: { SHARED_TREE_GUARDS_OFF: '1' }
  input: { command: 'git add a.md && git commit -m "x"' }
  expected: { exit: 0 }

- id: AC-14
  guard: commit-guard
  repo: { staged: [a.md, b.md], git_on_path: false }
  input: { command: 'git add a.md && git commit -m "x"' }
  expected: { exit: 0 }

- id: AC-15
  guard: commit-guard
  repo: { staged: [a.md, b.md] }
  input: { command: 'git add a.md && git commit -m "a title"' }
  expected: { exit: 2, stderr_contains: 'git commit -m "a title"' }

# Added 2026-09-24 while implementing the first slice: the co-tenancy gate is the thing that makes
# this plugin publishable and NO case asserted it over a real command (only AC-10/11, over --list).
# An invariant without a case is prose.

- id: AC-16
  guard: commit-guard
  repo: { staged: [a.md, b.md], live_sessions: 0 }
  input: { command: 'git add a.md && git commit -m "x"' }
  expected: { exit: 0, stderr: '' }

- id: AC-17
  guard: commit-guard
  repo: { staged_deletions_of_present_files: [z.md] }
  input: { command: 'git rm --cached z.md && git commit -m "x"' }
  expected: { exit: 0 }

- id: AC-18
  guard: cotenancy
  repo: { live_sessions: 2, self_in_linked_worktree: true }
  input: { mode: list, scope: tree }
  expected: { state: solo, others: 0 }

- id: AC-19
  guard: overwrite-guard
  repo: { modified_uncommitted: [a.md], live_sessions: 0 }
  input: { command: 'git checkout origin/main -- a.md' }
  expected: { exit: 0, stderr: '' }

# AC-20 closes a hole the negative-control suite pointed at: AC-18 exercises 'tree' scope through
# the cotenancy CLI, but no case exercised it through a GUARD -- mutating 'tree'->'clone' in
# commit-guard made nothing fail.
#
# Hence my index must hold a leftover of MY OWN (d.md) that the command does not stage: under
# 'tree' scope the guard does not even run (nobody shares my working tree) and it passes; under
# 'clone' scope it would wake up because of the session in the main tree and block a commit that
# concerns nobody but me. Without d.md both scopes behave identically and the case proves nothing.
- id: AC-20
  guard: commit-guard
  repo:
    staged: [a.md, b.md]              # the other session's work, in the main tree
    live_sessions: 2
    self_in_linked_worktree: true
    staged_in_worktree: [c.md, d.md]  # MY index, with a leftover of mine the command does not stage
  input: { command: 'git add c.md && git commit -m "x"' }
  expected: { exit: 0, stderr: '' }
